<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F4D3A" />
    <title>لمسة — غير متصل</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #1F4D3A;
        color: #F1EFE9;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", sans-serif;
      }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 16px 0 0; font-size: 28px; }
      p { margin: 12px 0 0; color: #F1EFE9; opacity: 0.8; line-height: 1.6; }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #F1EFE9;
        color: #1F4D3A;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-512.png" alt="" />
      <h1>لمسة</h1>
      <p>أنت غير متصل بالإنترنت. صفحات الصيانة الأساسية متاحة لما النت يرجع، وطلبات الحساب مش بتتخزن على الجهاز.</p>
      <button type="button" onclick="location.reload()">حاول تاني</button>
    </main>
  </body>
</html>
